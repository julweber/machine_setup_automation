---
# vLLM — CPU-only backend, direct port exposure.
# Template rendered by tasks/setup-vllm.sh via envsubst.
# ${VLLM_MODEL}/${VLLM_EXTRA_ARGS} in the command block are resolved by
# docker compose at runtime from the .env file.
# Generated: ${GENERATED_DATE}
name: vllm

services:
  vllm:
    image: ${VLLM_IMAGE}
    container_name: vllm
    restart: unless-stopped
    env_file:
      - .env
      - extra-vars.env
    environment:
      - HF_HOME=/root/.cache/huggingface
      - VLLM_NO_USAGE_STATS=1
    volumes:
      - "${HF_CACHE_DIR}:/root/.cache/huggingface"
      - "${PROJECT_DIR}/.vllm-cache:/root/.cache/vllm"
      - "${LMSTUDIO_MODELS_DIR}:/lmstudio-models"
    shm_size: '${VLLM_SHM_SIZE}'
    ports:
      - "${VLLM_PORT}:8000"
    networks:
      - vllm
    command: >
      --model ${VLLM_MODEL}
      --host 0.0.0.0
      --port 8000
      --device cpu
      ${VLLM_COMMAND_FLAGS}
      ${VLLM_EXTRA_ARGS}

networks:
  vllm:
    external: false
