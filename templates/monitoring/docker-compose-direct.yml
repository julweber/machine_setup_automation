# docker-compose-direct.yml — Monitoring stack, direct access mode
# Prometheus + Grafana + Node Exporter + cAdvisor
# Generated by tasks/setup-monitoring.sh
# Do not edit manually — overwritten on the next run.
# Template placeholders use ${VAR} syntax, substituted via envsubst.
#
# Exposure: Grafana is published on ${GRAFANA_BIND_ADDRESS} (default: 0.0.0.0)
# and the Prometheus UI on ${PROMETHEUS_BIND_ADDRESS} (default: loopback).
# Node Exporter stays internal.

name: monitoring

networks:
  ${MONITORING_DOCKER_NETWORK}:
    driver: bridge

services:

  prometheus:
    image: ${PROMETHEUS_IMAGE_VERSION}
    container_name: prometheus
    restart: unless-stopped
    user: "65534:65534"
    group_add: ${DOCKER_GROUP_GID_LIST}
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --web.enable-lifecycle
    volumes:
      - ${PROMETHEUS_HOME}/config:/etc/prometheus:ro
      - ${PROMETHEUS_HOME}/data:/prometheus
      - /var/run/docker.sock:/var/run/docker.sock:ro
    ports:
      - "${PROMETHEUS_BIND_ADDRESS}:${PROMETHEUS_PORT}:9090"
    networks:
      - ${MONITORING_DOCKER_NETWORK}

  grafana:
    image: ${GRAFANA_IMAGE_VERSION}
    container_name: grafana
    restart: unless-stopped
    user: "472:472"
    env_file:
      - ${GRAFANA_ENV_FILE}
    environment:
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_USERS_AUTO_ASSIGN_ORG: "true"
      GF_USERS_AUTO_ASSIGN_ORG_ROLE: Admin
    volumes:
      - ${GRAFANA_HOME}/data:/var/lib/grafana
      - ${GRAFANA_HOME}/provisioning:/etc/grafana/provisioning
      - ${GRAFANA_HOME}/dashboards:/var/lib/grafana/dashboards
    ports:
      - "${GRAFANA_BIND_ADDRESS}:${GRAFANA_PORT}:3000"
    networks:
      - ${MONITORING_DOCKER_NETWORK}

  node_exporter:
    image: ${NODE_EXPORTER_IMAGE_VERSION}
    container_name: node_exporter
    restart: unless-stopped
    pid: host
    command:
      - --path.rootfs=/host
      - --web.listen-address=:9100
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/host:ro,rslave
    labels:
      - "prometheus.scrape=true"
      - "prometheus.port=9100"
    networks:
      - ${MONITORING_DOCKER_NETWORK}

  cadvisor:
    image: ${CADVISOR_IMAGE_VERSION}
    container_name: cadvisor
    restart: unless-stopped
    volumes:
      - /:/rootfs:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /sys:/sys:ro
      - /var/lib/docker:/var/lib/docker:ro
    labels:
      - "prometheus.scrape=true"
      - "prometheus.port=8080"
    networks:
      - ${MONITORING_DOCKER_NETWORK}
