# grafana-provisioning.yml — Grafana dashboard provider provisioning
# Generated by tasks/setup-monitoring.sh
# Do not edit manually — overwritten on the next run.
#
# Auto-loads dashboards (JSON files) from the mounted dashboards directory.
# Replaces the stock Grafana provisioning tree (disables sample dashboards).

apiVersion: 1

providers:
  - name: "default"
    orgId: 1
    folder: ""
    type: file
    disableDeletion: false
    editable: true
    updateIntervalSeconds: 60
    options:
      path: /var/lib/grafana/dashboards
