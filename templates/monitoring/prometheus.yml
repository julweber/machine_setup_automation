# prometheus.yml — Prometheus configuration
# Generated by tasks/setup-monitoring.sh
# Do not edit manually — overwritten on the next run.
#
# Uses Docker service discovery: only containers on the monitoring
# network carrying the `prometheus.scrape=true` label are scraped.

global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  # Scrape Prometheus itself (target up/down, scrape failures, TSDB metrics).
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: "node"
    docker_sd_configs:
      - host: "unix:///var/run/docker.sock"
        refresh_interval: 15s
    relabel_configs:
      # Keep only containers opted-in via prometheus.scrape label.
      - source_labels: ["__meta_docker_container_label_prometheus_scrape"]
        regex: "true"
        action: keep
      # Use prometheus.port label (e.g. "9100") as scrape port when set.
      - source_labels:
          - "__address__"
          - "__meta_docker_container_label_prometheus_port"
        regex: "(.*):(\\d+);(\\d+)"
        action: replace
        replacement: "$1:$3"
        target_label: "__address__"
