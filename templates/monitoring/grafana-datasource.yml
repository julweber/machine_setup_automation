# grafana-datasource.yml — Grafana datasource provisioning
# Generated by tasks/setup-monitoring.sh
# Do not edit manually — overwritten on the next run.
#
# Registers the Prometheus datasource pointing at the internal monitoring
# network hostname `prometheus` on port 9090.

apiVersion: 1

datasources:
  - name: Prometheus
    uid: prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: true
