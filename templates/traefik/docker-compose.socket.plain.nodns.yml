# docker-compose.yml — Generated by setup-traefik.sh — do not edit manually

services:

  # ── Docker Socket Proxy ────────────────────────────────────────────────────
  # Userspace API proxy: the environment list below IS the permission set.
  # Deliberately hardened (cap_drop: ALL + no-new-privileges) — widening its
  # rights would hand the host to anyone who can reach socket-net:2375.
  # read_only is NOT set: the v0.5.0 image is haproxy-based and the haproxy
  # master writes /run/haproxy.pid at startup, which crashes on a read-only
  # rootfs (verified against v0.5.0). cap_drop: ALL + no-new-privileges carry
  # the hardening; a tmpfs on /run could restore read_only if ever wanted.
  socket-proxy:
    image: ${SOCKET_PROXY_IMAGE}
    container_name: traefik-socket-proxy
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    tmpfs:
      - /tmp
    environment:
      CONTAINERS: 1
      NETWORKS: 1
      EVENTS: 1
      PING: 1
      VERSION: 1
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - socket-net
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:2375/_ping"]
      interval: 10s
      timeout: 3s
      retries: 3

  # ── Traefik ─────────────────────────────────────────────────────────────────
  traefik:
    image: ${TRAEFIK_IMAGE}
    container_name: traefik
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    depends_on:
      socket-proxy:
        condition: service_healthy
    ports:
      - target: ${HTTP_PORT}
        published: ${HTTP_PORT}
        mode: host
      - target: ${HTTPS_PORT}
        published: ${HTTPS_PORT}
        mode: host
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ${TRAEFIK_HOME}/traefik.yml:/etc/traefik/traefik.yml:ro
      - ${TRAEFIK_HOME}/dynamic:/etc/traefik/dynamic:ro
      - ${TRAEFIK_HOME}/letsencrypt:/letsencrypt
      - ${TRAEFIK_HOME}/auth:/etc/traefik/auth:ro
    networks:
      - socket-net
      - ${PROXY_NETWORK}
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=${PROXY_NETWORK}"

networks:
  socket-net:
    internal: true
  ${PROXY_NETWORK}:
    external: true
