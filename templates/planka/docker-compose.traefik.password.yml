services:
  planka:
    image: ${PLANKA_IMAGE}
    container_name: ${CONTAINER_NAME}
    restart: unless-stopped

    volumes:
      - ${PLANKA_HOME}/data:/app/data
    environment:
      - BASE_URL=${BASE_URL}
      - DATABASE_URL=${DATABASE_URL}
      - SECRET_KEY=${SECRET_KEY}
      # Uncomment and set to lock down the default admin (prevents edit/delete via UI):
      # - DEFAULT_ADMIN_EMAIL=${ADMIN_EMAIL}
      # Timezone / localisation
      # - DEFAULT_LANGUAGE=en-US
      # Upload / token settings
      # - MAX_UPLOAD_FILE_SIZE=
      # - TOKEN_EXPIRES_IN=365
      # Outgoing proxy / blocked IPs (internal Squid proxy used by default)
      # - OUTGOING_BLOCKED_HOSTS=localhost,postgres
    networks:
      - planka
      - proxy
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=${PROXY_NETWORK}"
      - "traefik.http.routers.planka.rule=Host(`${PLANKA_DOMAIN}`)"
      - "traefik.http.routers.planka.entrypoints=websecure"
      - "traefik.http.routers.planka.tls.certresolver=letsencrypt"
      - "traefik.http.services.planka.loadbalancer.server.port=1337"
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    container_name: ${CONTAINER_NAME}-postgres
    restart: unless-stopped
    networks:
      - planka
    volumes:
      - ${PLANKA_HOME}/postgres:/var/lib/postgresql/data
    environment:
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_HOST_AUTH_METHOD=${PG_AUTH_METHOD}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

networks:
  planka:
    external: false
  proxy:
    external: true
