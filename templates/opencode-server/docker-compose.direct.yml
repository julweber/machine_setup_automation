# Opencode Server Docker Compose Configuration
# Generated: ${GENERATED_DATE}

networks:
  opencode:
    external: false

services:
  opencode:
    image: ${OPENCODE_IMAGE}
    container_name: opencode
    restart: unless-stopped
    env_file:
      - .env
    command: ["serve", "--hostname", "0.0.0.0", "--port", "4096"]
    ports:
      - "${OPENCODE_PORT}:4096"
    networks:
      - opencode
    volumes:
      - opencode_data:/data

volumes:
  opencode_data:
