# Open WebUI Docker Compose Configuration
# Generated: ${GENERATED_DATE}
# Note: WEBUI_SECRET_KEY is resolved at runtime from ${PROJECT_DIR}/.env (mode 600).
#       It is intentionally left as a literal ${VAR} token in this file.

networks:
  openwebui:
    external: false
  ${PROXY_NETWORK}:
    external: true

services:
  openwebui:
    image: ghcr.io/open-webui/open-webui:main
    container_name: openwebui
    restart: unless-stopped
    environment:
      # Connect to your LM Studio API
      - OLLAMA_BASE_URL=http://localhost:${LM_STUDIO_PORT}/v1
      - WEBUI_HOST=0.0.0.0
      - WEBUI_PORT=8080
      # Secret key resolved from the project .env at runtime
      - WEBUI_SECRET_KEY=${WEBUI_SECRET_KEY}
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=${PROXY_NETWORK}"
      - "traefik.http.routers.openwebui.rule=Host(`${OPENWEBUI_DOMAIN}`)"
      - "traefik.http.routers.openwebui.entrypoints=websecure"
      - "traefik.http.routers.openwebui.tls.certresolver=letsencrypt"
      - "traefik.http.services.openwebui.loadbalancer.server.port=8080"
    networks:
      - openwebui
      - ${PROXY_NETWORK}
    volumes:
      - openwebui_data:/app/backend/data

volumes:
  openwebui_data:
