---
services:
  hermes-gateway:
    image: nousresearch/hermes-agent:latest
    container_name: hermes-gateway
    working_dir: /workspace
    volumes:
      - /srv/hermes/.hermes:/opt/data           # Hermes config, memory, skills
      - /srv/hermes/workspace:/workspace        # Your workspace (read-write)
    environment:
      # Terminal backend for LOCAL execution in gateway container
      - TERMINAL_ENV=local                        # Use local backend
      - TERMINAL_CWD=/workspace                   # Working directory
      # Persist shell state across commands
      - TERMINAL_LOCAL_PERSISTENT=false     # Set to true for persistent shell
    cap_add:
      - DAC_OVERRIDE                            # Allow file permission changes
      - CHOWN                                   # Allow chown

    # Optional: Add your own environment variables here
    # environment:
    #   - OPENROUTER_API_KEY=${OPEN...KEY}
    #   - GITHUB_TOKEN=***

    restart: unless-stopped
    command: ["gateway"]

  hermes-chat:
    image: nousresearch/hermes-agent:latest
    profiles:
      - manual
    container_name: hermes-chat
    working_dir: /workspace
    volumes:
      - /srv/hermes/.hermes:/opt/data
      - /srv/hermes/workspace:/workspace
    environment:
      - TERMINAL_ENV=local
      - TERMINAL_CWD=/workspace
      - TERMINAL_LOCAL_PERSISTENT=false
    cap_add:
      - DAC_OVERRIDE
      - CHOWN
    stdin_open: true
    tty: true
    command: ["chat"]

  hermes-dashboard:
    image: nousresearch/hermes-agent:latest
    container_name: hermes-dashboard
    working_dir: /workspace
    volumes:
      - /srv/hermes/.hermes:/opt/data
    environment:
      - TERMINAL_ENV=local
      - TERMINAL_CWD=/workspace
      - TERMINAL_LOCAL_PERSISTENT=false
    cap_add:
      - DAC_OVERRIDE
      - CHOWN
    restart: unless-stopped
    depends_on:
      - hermes-gateway
    command: ["dashboard", "--host", "127.0.0.1", "--no-open"]

  hermes-setup:
    image: nousresearch/hermes-agent:latest
    profiles:
      - manual
    container_name: hermes-setup
    working_dir: /workspace
    volumes:
      - /srv/hermes/.hermes:/opt/data
      - /srv/hermes/workspace:/workspace
    environment:
      - TERMINAL_ENV=local
      - TERMINAL_CWD=/workspace
      - TERMINAL_LOCAL_PERSISTENT=false
    cap_add:
      - DAC_OVERRIDE
      - CHOWN
    stdin_open: true
    tty: true
    command: ["setup"]
