---
# ColQwen2.5 embedding service.
# All configuration is read from the .env file next to this compose file -
# edit .env, then: docker compose build && docker compose up -d
services:
  colqwen:
    build:
      context: .
      args:
        NGC_PYTORCH_TAG: "${NGC_PYTORCH_TAG}"
        COLPALI_VERSION: "${COLPALI_VERSION}"
    container_name: colqwen
    restart: unless-stopped
    # NGC PyTorch images recommend host IPC plus raised memlock/stack limits
    # (docker run --ipc=host --ulimit memlock=-1 --ulimit stack=67108864).
    # Not strictly needed for this single-process inference service, but it
    # silences the SHMEM startup NOTE and avoids the 64MB /dev/shm cap if
    # multi-process code (e.g. DataLoader workers) is ever added.
    ipc: host
    ulimits:
      memlock: -1
      stack: 67108864
    environment:
      - COLQWEN_MODEL=${COLQWEN_MODEL}
      - HF_HOME=${COLQWEN_MODEL_DIR}
      - HF_HUB_OFFLINE=1
      - TRANSFORMERS_OFFLINE=1
    # The model dir is mounted at the IDENTICAL path so absolute
    # base_model_name_or_path entries in adapter_config.json resolve.
    volumes:
      - "${COLQWEN_MODEL_DIR}:${COLQWEN_MODEL_DIR}:ro"
    # Published on COLQWEN_BIND, which defaults to 127.0.0.1. The service has
    # no authentication of its own, so the bind address is what keeps
    # /embed/queries and /embed/images off the network.
    #
    # ufw does NOT cover this: Docker installs its published-port DNAT rules
    # ahead of ufw's filter chains, so a default-deny policy leaves a
    # 0.0.0.0-published port reachable from the LAN and over any VPN.
    #
    # The :-127.0.0.1 fallback is deliberate: an .env without COLQWEN_BIND
    # would otherwise substitute to ":8100:8000", and an empty host_ip means
    # all interfaces - the exact failure this setting exists to prevent.
    ports:
      - "${COLQWEN_BIND:-127.0.0.1}:${COLQWEN_PORT}:8000"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
