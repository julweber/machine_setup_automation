featureName: concourse-ci
branchName: feat/concourse-ci
tasks:
  - id: "task-001"
    title: "Create pre-flight checks for dependencies"
    description: "Implement validation logic to check that Docker is installed and running, OpenSSL is available, and curl is installed before proceeding with Concourse setup. The script should exit with clear error messages if any dependency is missing. This implements the Pre-flight Checks behavior (behaviors.md#1-preflight-checks)."
    source:
      - "specification/features/concourse-ci/behaviors.md#1-preflight-checks"
    priority: 1
    dependsOn: []
    successCriteria:
      - "Script checks Docker installation with command -v docker"
      - "Script checks Docker daemon is running by executing docker info"
      - "Script checks OpenSSL availability with command -v openssl"
      - "Script checks curl availability with command -v curl"
      - "All existing tests continue to pass"
    status: passed
    attempts: 1

  - id: "task-002"
    title: "Implement Traefik integration pre-checks"
    description: "Add logic to verify the proxy network exists and CONCOURSE_DOMAIN is set when CONCOURSE_TRAEFIK=true. This implements the edge case handling in Pre-flight Checks (behaviors.md#1-preflight-checks)."
    source:
      - "specification/features/concourse-ci/behaviors.md#1-preflight-checks"
    priority: 2
    dependsOn:
      - "task-001"
    successCriteria:
      - "When CONCOURSE_TRAEFIK=true, script sources lib/core.sh if it exists"
      - "Script verifies proxy network exists when Traefik integration is enabled"
      - "Script exits with error if CONCOURSE_DOMAIN is not set in Traefik mode"
      - "All existing tests continue to pass"
    status: passed
    attempts: 3

  - id: "task-003"
    title: "Add port availability check for direct access mode"
    description: "Implement logic to warn and prompt user when the Concourse web port (default 8089) is already in use, but only when CONCOURSE_TRAEFIK=false. This implements the edge case from Pre-flight Checks (behaviors.md#1-preflight-checks)."
    source:
      - "specification/features/concourse-ci/behaviors.md#1-preflight-checks"
    priority: 3
    dependsOn:
      - "task-002"
    successCriteria:
      - "Port check is skipped when CONCOURSE_TRAEFIK=true"
      - "When port is in use, user is warned and prompted to confirm proceeding"
      - "Script exits gracefully if user declines to proceed"
      - "All existing tests continue to pass"
    status: passed
    attempts: 1

  - id: "task-004"
    title: "Implement existing deployment detection with user confirmation"
    description: "Add logic to detect an existing docker-compose.yml at the target directory and prompt user before taking destructive action. If re-creating, preserve RSA keys in keys/ directory and PostgreSQL data volume. This implements Idempotency Detection (behaviors.md#2-idempotency-detection)."
    source:
      - "specification/features/concourse-ci/behaviors.md#2-idempotency-detection"
    priority: 4
    dependsOn:
      - "task-003"
    successCriteria:
      - "Script checks for existing docker-compose.yml at CONCOURSE_HOME"
      - "User is warned and prompted before destructive re-creation"
      - "RSA keys in keys/ directory are preserved during re-deployment"
      - "PostgreSQL data volume persists across re-deployments"
      - "All existing tests continue to pass"
    status: passed
    attempts: 1

  - id: "task-005"
    title: "Create directory structure for Concourse configuration"
    description: "Implement creation of the CONCOURSE_HOME directory (default /srv/concourse) with subdirectories keys/web and keys/worker. Ensure all directories are accessible by Docker daemon. This implements Directory Creation (behaviors.md#3-directory-creation)."
    source:
      - "specification/features/concourse-ci/behaviors.md#3-directory-creation"
    priority: 5
    dependsOn:
      - "task-004"
    successCriteria:
      - "CONCOURSE_HOME directory is created if it doesn't exist"
      - "Subdirectories keys/web and keys/worker are created"
      - "Directories have appropriate permissions for Docker daemon access"
      - "Script exits with error if directory creation fails due to permissions"
      - "All existing tests continue to pass"
    status: passed
    attempts: 1

  - id: "task-006"
    title: "Implement RSA key generation with idempotency"
    description: "Generate three pairs of RSA keys (TSA host, session signing, worker) using OpenSSL with empty passphrases. Preserve existing keys to maintain session continuity. This implements RSA Key Generation (behaviors.md#4-rsa-key-generation)."
    source:
      - "specification/features/concourse-ci/behaviors.md#4-rsa-key-generation"
    priority: 6
    dependsOn:
      - "task-005"
    successCriteria:
      - "TSA host key pair is generated (host_key and host_key.pub)"
      - "Session signing key pair is generated (session_signing_key and session_signing_key.pub)"
      - "Worker key pair is generated (worker_key and worker_key.pub)"
      - "Keys are only created if they don't already exist"
      - "chmod -R 700 is applied to keys directory after generation"
      - "All existing tests continue to pass"
    status: pending
    attempts: 0

  - id: "task-007"
    title": "Generate .env file with configuration and secrets"
    description: "Create a .env file containing all configuration values including auto-generated PostgreSQL password, admin password, external URL from host LAN IP, and other environment variables. This implements Environment File Generation (behaviors.md#5-environment-file-generation)."
    source:
      - "specification/features/concourse-ci/behaviors.md#5-environment-file-generation"
    priority: 7
    dependsOn:
      - "task-006"
    successCriteria:
      - "PostgreSQL password is generated with openssl rand -base64 32"
      - "Admin password is generated with openssl rand -base64 32"
      - "External URL is auto-detected from host LAN IP if not set"
      - ".env file has permissions 600 after creation"
      - "User-provided values take precedence over auto-generated ones"
      - "All existing tests continue to pass"
    status: pending
    attempts: 0

  - id: "task-008"
    title": "Dynamically generate docker-compose.yml"
    description: "Create a script that generates a docker-compose.yml file with PostgreSQL, web, and worker services. Include Traefik integration when enabled. This implements Docker Compose Generation (behaviors.md#6-docker-compose-generation)."
    source:
      - "specification/features/concourse-ci/behaviors.md#6-docker-compose-generation"
    priority: 8
    dependsOn:
      - "task-007"
    successCriteria:
      - "PostgreSQL service includes health check and volume persistence"
      - "Web node service has proper dependencies, environment variables, and key mounts"
      - "Worker service runs privileged with SIGUSR2 shutdown signal"
      - "Traefik network and labels are added when CONCOURSE_TRAEFIK=true"
      - "Port exposure is omitted for web UI in Traefik mode"
      - "All existing tests continue to pass"
    status: pending
    attempts: 0

  - id: "task-009"
    title": "Implement Docker image pull and stack start"
    description: "Add logic to pull all required Docker images (postgres:15, concourse/concourse:latest) and start the stack in detached mode. This implements Image Pull & Stack Start (behaviors.md#7-image-pull-stack-start)."
    source:
      - "specification/features/concourse-ci/behaviors.md#7-image-pull-stack-start"
    priority: 9
    dependsOn:
      - "task-008"
    successCriteria:
      - "All images are pulled before starting services"
      - "Services start in correct order (database first)"
      - "Stack runs in detached mode with docker compose up -d"
      - "Script exits with error on image pull failure"
      - "Docker logs are displayed on service startup failure"
      - "All existing tests continue to pass"
    status: pending
    attempts: 0

  - id: "task-010"
    title": "Implement health check loop for Concourse web UI"
    description: "Create a polling loop that checks the /api/v1/info endpoint every 5 seconds, with a maximum wait of 120 seconds. This implements Health Check Loop (behaviors.md#8-health-check-loop)."
    source:
      - "specification/features/concourse-ci/behaviors.md#8-health-check-loop"
    priority: 10
    dependsOn:
      - "task-009"
    successCriteria:
      - "Script polls /api/v1/info endpoint every 5 seconds"
      - "HTTP 200, 302, or 303 responses indicate successful startup"
      - "Maximum wait time is 120 seconds with timeout warning"
      - "Docker exec is used for health check in Traefik mode"
      - "Connection refused errors are handled gracefully"
      - "All existing tests continue to pass"
    status: pending
    attempts: 0

  - id: "task-011"
    title": "Download and install Fly CLI tool"
    description: "Implement downloading and installing the fly CLI tool. Detect architecture (amd64 or arm64), download from Concourse API, verify as valid ELF binary, and install to /usr/local/bin/fly. This implements Fly CLI Installation (behaviors.md#9-fly-cli-installation)."
    source:
      - "specification/features/concourse-ci/behaviors.md#9-fly-cli-installation"
    priority: 11
    dependsOn:
      - "task-010"
    successCriteria:
      - "Architecture is detected (x86_64 → amd64, aarch64 → arm64)"
      - "Fly binary is downloaded from Concourse web UI API endpoint"
      - "Downloaded file is verified as valid ELF 64-bit executable"
      - "Binary is installed system-wide to /usr/local/bin/fly"
      - "Installation is skipped if fly is already in PATH"
      - "All existing tests continue to pass"
    status: pending
    attempts: 0

  - id: "task-012"
    title": "Configure Fly target for authenticated access"
    description: "Run fly login command non-interactively using admin credentials from .env file. Save authentication token to ~/.flyrc with configurable target name. This implements Fly Target Configuration (behaviors.md#10-fly-target-configuration)."
    source:
      - "specification/features/concourse-ci/behaviors.md#10-fly-target-configuration"
    priority: 12
    dependsOn:
      - "task-011"
    successCriteria:
      - "fly login executes non-interactively with admin credentials from .env"
      - "Authentication token is saved to ~/.flyrc"
      - "Target name is configurable via CONCOURSE_FLY_TARGET (default: concourse)"
      - "URL matches CONCOURSE_EXTERNAL_URL exactly"
      - "Script exits with error on authentication failure"
      - "All existing tests continue to pass"
    status: pending
    attempts: 0

  - id: "task-013"
    title": "Display deployment summary with useful information"
    description: "After successful setup, display comprehensive summary including web UI URL, admin credentials, data directory location, docker-compose file path, fly target name, and management commands. This implements Summary Output (behaviors.md#11-summary-output)."
    source:
      - "specification/features/concourse-ci/behaviors.md#11-summary-output"
    priority: 13
    dependsOn:
      - "task-012"
    successCriteria:
      - "Web UI URL is displayed (accounting for Traefik mode)"
      - "Admin credentials are clearly formatted for copying"
      - "Data directory location is shown"
      - "Docker Compose file path is displayed"
      - "Fly target name is shown"
      - "Useful management commands are printed"
      - "All existing tests continue to pass"
    status: pending
    attempts: 0
