featureName: backup-server
branchName: feat/backup-server
tasks:
  - id: "task-001"
    title: "Implement test suite for backup-server CLI"
    description: |
      Create the test suite file tests/test-backup-server.sh following TDD principles. This is a TDD task — the implementation does not exist yet, so all tests are expected to fail. Do NOT run the test suite against production code. The quality gate requiring passing tests is DISABLED for this task.
      
      Tests should cover: CLI argument parsing (getopts), configuration file validation (yq), color-coded output functions, and mock restic commands. Reference lib/helpers.sh for existing patterns. Use shellcheck -s bash for linting.
    source:
      - "specification/features/backup-server/behaviors.md#behavior-1-full-component-backup"
      - "specification/features/backup-server/tests.md"
      - "specification/project/test-strategy.md"
    priority: 1
    dependsOn: []
    successCriteria:
      - "tests/test-backup-server.sh exists and covers test cases from tests.md"
      - "shellcheck -s bash tests/test-backup-server.sh reports no errors"
      - "The test suite can be invoked without crashing (exits 0 regardless of test results)"
      - "Tests are expected to fail at this stage — a failing test suite is acceptable and expected"
      - "The quality gate requiring all tests to pass is DISABLED for this task"
    hints:
      - "TDD suites must exit 0 regardless of results — document this in the file header"
    status: pending
    attempts: 0
  - id: "task-002"
    title: "Create custom Docker image with restic"
    description: |
      Create a Dockerfile that extends offen/docker-volume-backup:v2 and installs restic >= 0.18.x. The image should include necessary dependencies for the copy-post hook script to function. Save as tasks/backup-server/Dockerfile or utilities/.
      
      Follow project conventions: use hadolint for Dockerfile linting, ensure bash as entrypoint.
    source:
      - "specification/features/backup-server/behaviors.md#architecture-integration-strategy"
      - "specification/features/backup-server/implementation-details.md#tool-versions-requirements"
    priority: 2
    dependsOn: []
    successCriteria:
      - "Dockerfile extends offen/docker-volume-backup:v2 base image"
      - "restic >= 0.18.x is installed in the image"
      - "Image can be built without errors (docker build succeeds)"
      - "All existing tests continue to pass"
    status: pending
    attempts: 0
  - id: "task-003"
    title: "Implement copy-post hook script for restic backup"
    description: |
      Create the bash script that Offen invokes as its copy-post hook to call restic backup. Must handle COMPONENT_NAME from DOCKER_VOLUME_BACKUP_CONTAINER_NAME, set RESTIC_REPOSITORY and RESTIC_PASSWORD from environment/config, run restic backup with proper tagging (component:name, backup-date:timestamp), support progress output.
      
      Save in utilities/restic-backup-hook.sh or similar. Reference implementation-details.md for the example script pattern.
    source:
      - "specification/features/backup-server/implementation-details.md#example-custom-restic-script-copy-post-hook"
    priority: 3
    dependsOn: ["task-002"]
    successCriteria:
      - "Hook script exists and accepts required environment variables"
      - "Runs restic backup with --tag component:<name> for snapshot identification"
      - "Outputs progress information to stdout/stderr"
      - "shellcheck -s bash reports no errors"
      - "All existing tests continue to pass"
    status: pending
    attempts: 0
  - id: "task-004"
    title: "Build backup configuration parsing with yq"
    description: |
      Implement YAML configuration file parsing using the yq command-line tool. Create functions to read and validate backup-config.yaml following the schema in behaviors.md.
      
      The parser must support: sources (docker_volumes, server_directories, home_directory_configs), targets array (location, type, enabled, credentials_env), encryption settings, retention policy, offen-specific settings.
    source:
      - "specification/features/backup-server/behaviors.md#configuration-file-schema-backup-config-yaml"
      - "specification/project/conventions.md"
    priority: 4
    dependsOn: []
    successCriteria:
      - "Configuration parser reads backup-config.yaml using yq without errors"
      - "Validates required fields and returns clear error messages for missing config"
      - "Provides functions to access sources, targets, encryption, retention, offen settings"
      - "shellcheck -s bash reports no errors"
      - "All existing tests continue to pass"
    hints:
      - "yq string scalars include surrounding quotes — strip with -r or sed"
    status: pending
    attempts: 0
  - id: "task-005"
    title: "Parse backup-config.yaml for sources and targets"
    description: |
      Implement the specific parsing logic to extract docker volumes, server directories, and target locations from backup-config.yaml. Use yq to query paths like .sources.docker_volumes, .targets[].location, etc.
      
      This builds on task-004's parser functions to get actual data for use in backup operations.
    source:
      - "specification/features/backup-server/behaviors.md#configuration-file-schema-backup-config-yaml"
      - "specification/project/concepts.md"
    priority: 5
    dependsOn: ["task-004"]
    successCriteria:
      - "Docker volumes can be discovered (docker volume ls parsing)"
      - "Server directories from config are enumerated correctly"
      - "Target locations extracted with correct type and enabled status"
      - "shellcheck -s bash reports no errors"
      - "All existing tests continue to pass"
    status: pending
    attempts: 0
  - id: "task-006"
    title: "Implement color-coded output using lib/helpers.sh"
    description: |
      Create utility functions for backup tool output that follow the same patterns as lib/helpers.sh. Must support: GREEN for success, CYAN for info/progress, YELLOW for warnings, RED for errors.
      
      These functions will be used by all subsequent tasks for consistent user experience per project conventions.
    source:
      - "specification/features/backup-server/behaviors.md#behavior-6-cli-interface-user-experience"
      - "specification/project/conventions.md#output-and-logging"
      - "lib/helpers.sh"
    priority: 6
    dependsOn: []
    successCriteria:
      - "Functions for log_success, log_info, log_warn, log_error exist in backup-server's lib or utilities/"
      - "Colors match project conventions (GREEN/CYAN/YELLOW/RED)"
      - "shellcheck -s bash reports no errors"
      - "All existing tests continue to pass"
    status: pending
    attempts: 0
  - id: "task-007"
    title: "Implement full component backup logic"
    description: |
      Implement the core backup function that orchestrates backing up components to targets. Must: discover Docker volumes, stop containers before backup (via Offen), call restic for each target independently, track all snapshot IDs in local manifest, run restic forget with retention policies.
      
      Save as utilities/backup-server.sh or similar. Follow the fail-fast error strategy from behaviors.md: exit immediately if Docker daemon not running, skip failed targets but continue, return non-zero on component failure.
    source:
      - "specification/features/backup-server/behaviors.md#behavior-1-full-component-backup"
      - "specification/project/conventions.md"
    priority: 7
    dependsOn: ["task-003", "task-005", "task-006"]
    successCriteria:
      - "Full backup completes successfully with manifest containing snapshot IDs per target"
      - "Docker volumes are discovered and backed up to each configured target"
      - "Manifest written to ~/.local/state/backup-tool/<timestamp>.json or similar"
      - "restic forget runs with retention policy from config"
      - "shellcheck -s bash reports no errors"
      - "All existing tests continue to pass"
    hints:
      - "Use mapfile -t arr < <(cmd) not arr=($(cmd)) — avoids SC2207"
    status: pending
    attempts: 0
  - id: "task-008"
    title: "Add multi-target backup support"
    description: |
      Extend the backup logic from task-007 to handle multiple target locations. For each component, run restic backup independently against EACH target (Option B strategy per implementation-details.md). Each target receives its own snapshot tagged with component name and timestamp.
      
      Must maintain manifest tracking ALL snapshot IDs across all targets for later restore/verify operations.
    source:
      - "specification/features/backup-server/behaviors.md#behavior-1-full-component-backup"
      - "specification/features/backup-server/implementation-details.md#multi-target-backup-strategy"
    priority: 8
    dependsOn: ["task-007"]
    successCriteria:
      - "Backup to multiple targets (e.g., local + S3) creates separate snapshots in each"
      - "Manifest correctly tracks which snapshot ID belongs to which target"
      - "Failure on one target doesn't stop backups to other targets (skip with warning)"
      - "shellcheck -s bash reports no errors"
      - "All existing tests continue to pass"
    status: pending
    attempts: 0
  - id: "task-009"
    title: "Implement incremental backup via restic CDC"
    description: |
      Implement the incremental backup flow that leverages restic's Content-Defined Chunking. Query existing snapshots tagged with component name, call restic backup (which automatically handles CDC), and tag new snapshots appropriately.
      
      Handle error cases: exit if no prior full backup found for target, fall back to full backup if chain broken. Note: The --incremental flag is documentation - restic backup always performs CDC-based incremental by default.
    source:
      - "specification/features/backup-server/behaviors.md#behavior-2-incremental-component-backup-via-restic-cdc"
    priority: 9
    dependsOn: ["task-007"]
    successCriteria:
      - "Incremental backup only uploads changed chunks (verify via restic stats)"
      - "Snapshots tagged with component name and timestamp for identification"
      - "Error if no prior full backup exists: clear message suggesting --full first"
      - "shellcheck -s bash reports no errors"
      - "All existing tests continue to pass"
    status: pending
    attempts: 0
  - id: "task-010"
    title: "Implement restore from backup logic"
    description: |
      Implement the restore flow that reads manifest, calls restic unlock on startup, determines source snapshot to restore from (default first available or --source <snapshot-id>), runs restic restore to temp location, copies data back into Docker volumes, and restarts containers.
      
      Must handle error cases: checksum mismatch exits immediately with details, target directory not empty in non-interactive mode errors out, existing volume warns and offers overwrite flags. Run restic check --read-data if --verify flag set.
    source:
      - "specification/features/backup-server/behaviors.md#behavior-3-restore-from-backup"
    priority: 10
    dependsOn: ["task-003", "task-005", "task-006"]
    successCriteria:
      - "Restore completes and data matches backed-up state exactly"
      - "Docker containers restart successfully after restore"
      - "--verify flag triggers restic check --read-data"
      - "Non-interactive mode correctly errors on non-empty target directory"
      - "shellcheck -s bash reports no errors"
      - "All existing tests continue to pass"
    status: pending
    attempts: 0
  - id: "task-011"
    title: "Add --verify flag with restic check"
    description: |
      Implement the verification functionality using `restic check --read-data` to validate all chunk checksums against stored metadata. Must work for both backup (post-backup verify) and restore (pre-restore or post-restore verify).
      
      Can be combined with task-010's --verify flag implementation.
    source:
      - "specification/features/backup-server/behaviors.md#behavior-3-restore-from-backup"
      - "specification/features/backup-server/behaviors.md#behavior-5-backup-management-operations"
    priority: 11
    dependsOn: ["task-010"]
    successCriteria:
      - "--verify flag triggers restic check --read-data on specified target or all targets"
      - "Reports any corruption, missing files, or size mismatches with detailed error codes"
      - "shellcheck -s bash reports no errors"
      - "All existing tests continue to pass"
    status: pending
    attempts: 0
  - id: "task-012"
    title: "Implement selective component backup/restore (--components)"
    description: |
      Implement the --components flag that accepts comma-separated list of component names. Validate all requested components exist in config or match discovered volumes. For backup, only process specified components across all targets; for restore, only restore selected.
      
      Must handle error cases: unknown component name exits immediately with available components list; component not found on source without --allow-missing-components flag errors out. Warn about missing dependencies if applicable.
    source:
      - "specification/features/backup-server/behaviors.md#behavior-4-selective-component-backuprestore"
    priority: 12
    dependsOn: ["task-007", "task-010"]
    successCriteria:
      - "--components forgejo,openwebui only backs up/restores those components"
      - "Unknown component name exits with error showing available components"
      - "Component not found without --allow-missing-components flag errors out"
      - "shellcheck -s bash reports no errors"
      - "All existing tests continue to pass"
    status: pending
    attempts: 0
  - id: "task-013"
    title: "Implement backup management: list, cleanup, verify"
    description: |
      Implement the management operations: --list-backups (restic snapshots --json merged across targets), --cleanup with retention policy via restic forget per target, --verify using restic check.
      
      These are the core maintenance operations for backup lifecycle management beyond individual backup/restore operations.
    source:
      - "specification/features/backup-server/behaviors.md#behavior-5-backup-management-operations"
    priority: 13
    dependsOn: ["task-006", "task-009"]
    successCriteria:
      - "--list-backups shows all snapshots with timestamps, components, locations sorted newest first"
      - "--cleanup applies retention policy via restic forget per target"
      - "Retention never deletes last anchor backup (restic's built-in behavior)"
      - "shellcheck -s bash reports no errors"
      - "All existing tests continue to pass"
    status: pending
    attempts: 0
  - id: "task-014"
    title: "Add --list-backups via restic snapshots --json"
    description: |
      Implement --list-backups using `restic snapshots --json` to query all snapshots across configured repositories. Parse JSON output and display timestamp, component names, repository location, snapshot size sorted by timestamp descending.
      
      Merge results from multiple target locations if configured in backup-config.yaml.
    source:
      - "specification/features/backup-server/behaviors.md#behavior-5-backup-management-operations#list-backups---list-backups"
    priority: 14
    dependsOn: ["task-013"]
    successCriteria:
      - "--list-backups outputs all snapshots from configured targets"
      - "Output includes timestamp, component name, repository location, size for each snapshot"
      - "Results sorted newest first (timestamp descending)"
      - "shellcheck -s bash reports no errors"
      - "All existing tests continue to pass"
    status: pending
    attempts: 0
  - id: "task-015"
    title: "Integrate restic forget for retention policies"
    description: |
      Implement per-target retention policy enforcement using `restic forget` with flags --keep-weekly, --keep-daily, --keep-monthly, --keep-yearly from config.
      
      Apply independently to each configured target location. Ensure at least one full backup is always preserved as anchor point (restic's built-in behavior).
    source:
      - "specification/features/backup-server/behaviors.md#behavior-5-backup-management-operations"
    priority: 15
    dependsOn: ["task-008", "task-013"]
    successCriteria:
      - "--cleanup runs restic forget with correct retention flags per target"
      - "Retention respects keep-weekly, daily, monthly, yearly from config"
      - "At least one full backup always preserved as anchor point"
      - "shellcheck -s bash reports no errors"
      - "All existing tests continue to pass"
    status: pending
    attempts: 0
  - id: "task-016"
    title: "Implement CLI interface with getopts"
    description: |
      Build the main entrypoint script using bash getopts for argument parsing. Implement flags per behaviors.md: --full, --incremental, --config <file>, --target <location> (multiple), --encrypt/--passphrase-file, --restore, --source <snapshot-id>, --components, --list-backups, --cleanup, --verify, --retention, --allow-missing-components, --backup-existing, --force-overwrite, --dry-run, --quiet.
      
      Validate argument combinations before execution (e.g., --restore requires --source). Display usage help on error or with --help flag. Follow project conventions from lib/helpers.sh patterns.
    source:
      - "specification/features/backup-server/behaviors.md#behavior-6-cli-interface-user-experience"
      - "specification/project/conventions.md"
    priority: 16
    dependsOn: ["task-006"]
    successCriteria:
      - "All documented flags parse correctly via getopts"
      - "Invalid argument combinations display usage help with specific error"
      - "--help flag shows correct syntax and available options"
      - "Exit code 0 on success, non-zero on partial failure or error"
      - "shellcheck -s bash reports no errors"
      - "All existing tests continue to pass"
    hints:
      - "Use read -r answer || answer='n' for EOF-safe interactive reads"
    status: pending
    attempts: 0
  - id: "task-017"
    title: "Add dry-run, quiet modes, progress indicators"
    description: |
      Implement additional UX features: --dry-run mode (parse args and validate config, display what would happen without making changes), non-interactive/quiet mode (suppress colors, minimal output for scripted execution via BACKUP_QUIET=true or --quiet), real-time progress indicators showing percentage complete and throughput (MB/s) for large file backups.
      
      Also implement logging to ~/.local/state/backup-tool/<timestamp>.log with ISO 8601 timestamps per behaviors.md requirements.
    source:
      - "specification/features/backup-server/behaviors.md#behavior-6-cli-interface-user-experience"
    priority: 17
    dependsOn: ["task-001", "task-016"]
    successCriteria:
      - "--dry-run validates args and config, displays planned actions without filesystem changes"
      - "BACKUP_QUIET=true or --quiet suppresses colors and provides minimal output"
      - "Progress indicator shows percentage complete for large files (>10GB)"
      - "Log file created in ~/.local/state/backup-tool/ with ISO 8601 timestamps"
      - "shellcheck -s bash reports no errors"
      - "All existing tests continue to pass"
    status: pending
    attempts: 0
  - id: "task-018"
    title: "Verify idempotency and handle edge cases"
    description: |
      Test and ensure the backup tool is fully idempotent (running twice produces no errors on second run). Handle edge cases per behaviors.md:
      - Docker volume in use during backup (warn about potential inconsistency)
      - Symbolic links preserved as-is in archives
      - Permission denied handled gracefully (mark component as partial in manifest)
      - Disk space exhaustion rolls back and marks component failed
      
      Ensure all error exit codes are correct: 0=success, non-zero=partial failure or error.
    source:
      - "specification/features/backup-server/behaviors.md#behavior-1-full-component-backup"
      - "specification/project/concepts.md"
    priority: 18
    dependsOn: ["task-007", "task-010"]
    successCriteria:
      - "Running backup twice succeeds on second run (idempotency verified)"
      - "Edge cases handled per behaviors.md specifications"
      - "Exit codes correct: 0=success, non-zero=failure"
      - "shellcheck -s bash reports no errors"
      - "All existing tests continue to pass"
    status: pending
    attempts: 0
